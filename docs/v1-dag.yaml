        def fetch_earnings_dates(ticker: str, limit: int = 12) -> list[date]
            # from Ticker.get_earnings_dates(limit=limit) (fallback .earnings_dates); index -> tz-naive .date();
            # sorted unique; [] on None/exception. Future dates are kept (T3 ignores them).
        def fetch_peer_returns(peers: Sequence[str], period: str = "1y") -> pd.DataFrame
            # one column per peer of close.pct_change(); peers that fail are skipped; empty frame if none.
        All fetchers are looked up by name at call time by other modules (ingest does
        `from stock_moves import prices; prices.fetch_ohlcv(...)`), so keep them module-level functions.

      tests/test_prices.py (no network): normalize_ohlcv on a hand-built frame with tz-aware index
      ("America/New_York"), capitalised columns, a duplicate date and a NaN close -> lower-case columns,
      tz-naive index named "date", duplicate collapsed, NaN row dropped; MultiIndex-column input handled;
      sector_etf_for known/unknown/None. Add a `@pytest.mark.skip(reason="network")` smoke test that would
