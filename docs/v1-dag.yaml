      news/base.py:
        @dataclass(frozen=True) class NewsItem: url: str; title: str; source: str | None;
            published_at: datetime | None; language: str | None; news_source: str; bucket: str
        class NewsSource(Protocol):
            name: str
            def search(self, query: str, start: date, end: date, limit: int = 30) -> list[NewsItem]: ...
        MACRO_QUERY_TERMS: tuple[str, ...] = ("Federal Reserve", "interest rates", "inflation", "CPI", "tariffs",
            "jobs report", "Treasury yields", "recession", "stock market")
        def clean_company_name(name: str) -> str
            # strip suffixes (Inc, Inc., Corp, Corporation, Ltd, plc, Co, Company, Holdings, Group, N.V., S.A.,
            # "The " prefix), trailing commas/periods; "Apple Inc." -> "Apple"; "NVIDIA Corporation" -> "NVIDIA".
        def window_for(move_date: date, before: int = 1, after: int = 1) -> tuple[date, date]
        def build_query(bucket: str, company_name: str, ticker: str, peers: Sequence[str] = (),
                        industry: str | None = None) -> str
