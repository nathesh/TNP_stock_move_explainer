# v1 task DAG for stock-move-explainer. Human twin: docs/v1-plan.md.
# Each `prompt` is handed to one coding agent verbatim. Common preamble for every agent:
#   - Work only in /Users/thejasprasad/Documents/tetrix-take-home. Read DESIGN.md first; it is the source
#     of truth and must not be changed. docs/architecture-v1.md holds the table columns.
#   - Package: src/stock_moves (Python 3.12, uv). Touch only the files in `owns`. No new dependencies.
#   - Before reporting run: uv run ruff check . && uv run ruff format . && uv run pytest -q
#   - No network calls inside pytest. Report the exact files changed and the public names exposed.
common_preamble: |
  You are implementing one task of a 4-hour Python take-home. Repo: /Users/thejasprasad/Documents/tetrix-take-home
  (package src/stock_moves, Python 3.12, uv, pytest, ruff). First read DESIGN.md completely; it is the source of
  truth and you must not change it. docs/architecture-v1.md has the exact table columns. Then do the task below.
  Rules: touch only the files listed under OWNS; add no dependencies; type-hint everything; never call the
  network inside pytest; if an upstream module is not there yet, code against the signature given here and make
  your tests exercise your own code. Before reporting run from the repo root:
  uv run ruff check . && uv run ruff format . && uv run pytest -q
  Report: absolute paths of files created/edited, public names exposed, the test result, any deviation.

tasks:
  - id: T1
    title: Settings, SQLite engine, SQLModel tables, test DB fixture
    wave: 1
    depends_on: []
    critical_path: true
    estimate_min: 25
    owns:
      - src/stock_moves/settings.py
      - src/stock_moves/db.py
      - src/stock_moves/models.py
      - tests/conftest.py
      - tests/test_models.py
    prompt: |
      TASK T1 — settings, engine, tables. Everything downstream imports from these three modules, so the names
      and signatures below are a contract; implement them exactly.

      OWNS: src/stock_moves/settings.py, src/stock_moves/db.py, src/stock_moves/models.py, tests/conftest.py,
      tests/test_models.py.

      1) src/stock_moves/settings.py
         from pydantic import BaseModel; use python-dotenv to load a .env file from the repo root if present.
         class Settings(BaseModel):
             anthropic_api_key: str | None = None      # env ANTHROPIC_API_KEY
             anthropic_model: str = "claude-opus-5"    # env ANTHROPIC_MODEL
             news_source: str = "google_rss"           # env NEWS_SOURCE, "google_rss" | "gdelt"
             db_path: Path = Path("data/app.db")       # env DB_PATH
             default_period: str = "1y"
             default_top_n: int = 10
             default_z_threshold: float = 2.0
             default_pct_threshold: float = 0.02
             top_k_articles: int = 8                   # articles handed to the explainer
             news_limit: int = 30                      # items per news query
             gdelt_throttle_s: float = 5.0
             http_timeout_s: float = 20.0
         def get_settings() -> Settings   # @functools.lru_cache; reads os.environ (after load_dotenv) for every
                                          # field using the upper-cased field name; empty strings count as unset.
         Tests will call get_settings.cache_clear() after monkeypatching env.

      2) src/stock_moves/db.py
         Module-level cached engine. SQLite; for file paths create the parent directory; connect_args
         {"check_same_thread": False}; for "sqlite://" (in-memory) use sqlalchemy.pool.StaticPool so every session
         shares one connection.
         def configure_engine(url: str) -> Engine   # replaces the cached engine, returns it
         def get_engine() -> Engine                 # cached, else built from f"sqlite:///{get_settings().db_path}"
         def init_db(engine: Engine | None = None) -> None      # SQLModel.metadata.create_all
         def get_session() -> Iterator[Session]     # generator: `with Session(get_engine()) as s: yield s`
         @contextmanager def session_scope() -> Iterator[Session]   # commit on success, rollback on error
         Also `from sqlmodel import Session` re-exported so callers can `from stock_moves.db import Session`.

      3) src/stock_moves/models.py — SQLModel tables (table=True), __tablename__ exactly as listed, columns from
         docs/architecture-v1.md. Use `from datetime import date, datetime`, `Field`, `UniqueConstraint`.
         Company (companies): ticker: str PK; name: str; sector: str|None; industry: str|None; sector_etf: str|None;
           peers_json: str = "[]"; updated_at: datetime (default utcnow). Property `peers -> list[str]` (json.loads).
         Price (prices): id int PK; ticker str index; date date index; open, high, low, close, volume: float;
           ret, gap_ret, intraday_ret, ret_z, vol_z, mkt_component, sector_component, idio_component: float|None;
           routing: str|None; regime_mkt: str|None; regime_sector: str|None; near_earnings: bool = False.
           UniqueConstraint("ticker", "date", name="uq_price_ticker_date").
         Move (moves): id PK; ticker index; date index; ret, ret_z: float; gap_ret, intraday_ret, vol_z,
           mkt_component, sector_component, idio_component: float|None; routing: str; direction: str ("up"/"down");
           regime_mkt, regime_sector: str|None; near_earnings: bool = False; peer_comove: float|None;
           created_at datetime. UniqueConstraint("ticker", "date", name="uq_move_ticker_date").
         Article (articles): id PK; url: str unique index; title: str; source: str|None; language: str|None;
           published_at: datetime|None; news_source: str ("google_rss"|"gdelt"); fetched_at datetime.
         MoveArticle (move_articles): move_id: int FK moves.id PK; article_id: int FK articles.id PK;
           relevance: float; category: str; provider: str.
         Explanation (explanations): id PK; move_id int FK moves.id unique; summary: str; primary_category: str;
           confidence: float; cited_article_ids_json: str = "[]"; unexplained: bool = False; provider: str;
           created_at datetime. Property `cited_article_ids -> list[int]`.
         ChatMessage (chat_messages): id PK; session_id str index; role str ("user"|"assistant"|"tool");
           content str; tool_calls_json: str|None; created_at datetime.

      4) tests/conftest.py — pytest fixtures shared by every later test module:
         @pytest.fixture def session() -> Iterator[Session]: configure_engine("sqlite://"); init_db(); yield a
         Session; on teardown dispose the engine. Also a fixture `no_api_key(monkeypatch)` that deletes
         ANTHROPIC_API_KEY from the env and calls get_settings.cache_clear(). Keep this file to those two fixtures;
         other tasks add their own fixtures inside their own test files.

      5) tests/test_models.py — using the `session` fixture: insert one row per table (a Move that references a
         Price date, a MoveArticle linking them, an Explanation, a ChatMessage) and read them back; inserting a
         second Price with the same (ticker, date) raises sqlalchemy.exc.IntegrityError; Company.peers parses
         peers_json; get_settings() defaults are as listed and DB_PATH env overrides db_path.

      ACCEPTANCE: uv run pytest -q tests/test_models.py passes; ruff clean.

  - id: T2
    title: ModelProvider protocol, HeuristicProvider, chat tool specs
    wave: 1
    depends_on: []
    critical_path: false
    estimate_min: 30
    owns:
      - src/stock_moves/providers/__init__.py
      - src/stock_moves/providers/base.py
      - src/stock_moves/providers/heuristic.py
      - tests/test_heuristic_provider.py
    prompt: |
      TASK T2 — the model layer interface (DESIGN §4) and the keyless implementation. Do NOT import
      stock_moves.models or stock_moves.settings here except lazily inside get_provider(); wave-1 modules land
      in parallel and this one must import cleanly on its own.

      OWNS: src/stock_moves/providers/__init__.py, providers/base.py, providers/heuristic.py,
      tests/test_heuristic_provider.py.

      1) providers/base.py — plain dataclasses (frozen where noted), a Protocol, and two constants.
         @dataclass(frozen=True) class ArticleInput: id: int; title: str; source: str | None; url: str;
             published_at: datetime | None
             @classmethod from_object(cls, a: Any) -> ArticleInput   # reads attributes by name (duck-typed)
         @dataclass(frozen=True) class MoveContext: ticker: str; company_name: str; date: date; ret: float;
             ret_z: float; gap_ret: float|None; intraday_ret: float|None; vol_z: float|None;
             mkt_component: float|None; sector_component: float|None; idio_component: float|None; routing: str;
             direction: str; regime_mkt: str|None; regime_sector: str|None; near_earnings: bool;
             sector: str|None; industry: str|None; peers: tuple[str, ...]; peer_comove: float|None
             @classmethod from_objects(cls, move: Any, company: Any) -> MoveContext
                 # move has the Move table's attributes; company has name/sector/industry/peers (a list).
                 # Read with getattr(obj, name, None); this is what lets wave-2 modules build a context
                 # without this file importing models.py.
         @dataclass(frozen=True) class ArticleScore: article_id: int; relevance: float; category: str
             # category in {"company","industry","macro"}
         @dataclass(frozen=True) class ExplanationResult: summary: str; primary_category: str;
             confidence: float; cited_article_ids: tuple[int, ...]; unexplained: bool
             # primary_category in {"company","industry","macro","unexplained"}; confidence in [0,1]
         @dataclass class ChatTurn: role: str; content: str          # role "user" | "assistant"
         @dataclass class ToolCallRecord: name: str; input: dict[str, Any]; output: Any
         @dataclass class ChatReply: reply: str; tool_calls: list[ToolCallRecord]
         ToolFn = Callable[..., Any]   # called with keyword args from the tool input; returns JSON-serialisable
         MACRO_TERMS: tuple[str, ...] = ("federal reserve", "fed ", "fomc", "interest rate", "rate cut",
             "rate hike", "inflation", "cpi", "ppi", "jobs report", "payrolls", "unemployment", "tariff",
             "treasury", "yields", "recession", "gdp", "oil price", "crude", "dollar", "geopolit", "stimulus")
         TOOL_SPECS: list[dict[str, Any]]   # Anthropic tool format: {"name", "description", "input_schema"}
           list_moves: {ticker: string (optional, defaults to the session ticker), start: string YYYY-MM-DD opt,
                        end: string opt, direction: "up"|"down" opt, limit: integer opt default 10}
             description: "Largest daily moves for a ticker, sorted by absolute z-score, with the cached
                           explanation summary when one exists."
           get_move: {ticker: string opt, date: string YYYY-MM-DD required}
             description: "One move with its decomposition, linked articles and explanation."
           search_news: {ticker: string opt, query: string opt, start: string opt, end: string opt,
                         limit: integer opt default 20}
             description: "Headlines linked to a ticker's moves, filtered by a substring of the title."
           Return shapes (documented in the descriptions, implemented in T10 queries.py):
             move dict: {date, ret, ret_z, gap_ret, intraday_ret, vol_z, direction, routing, near_earnings,
                         regime_mkt, regime_sector, mkt_component, sector_component, idio_component,
                         peer_comove, explanation: {summary, primary_category, confidence, cited_article_ids,
                         unexplained} | null, articles: [article dict] (get_move only)}
             article dict: {id, title, source, url, published_at, relevance, category}
         class ModelProvider(Protocol):
             name: str
             def score_articles(self, move: MoveContext, articles: Sequence[ArticleInput]) -> list[ArticleScore]: ...
             def explain(self, move: MoveContext, scored: Sequence[tuple[ArticleInput, ArticleScore]]) -> ExplanationResult: ...
             def suggest_peers(self, ticker: str, name: str, sector: str | None, industry: str | None) -> list[str]: ...
             def chat(self, history: Sequence[ChatTurn], tools: Mapping[str, ToolFn], ticker: str | None) -> ChatReply: ...
             # `scored` is sorted by relevance desc, already cut to top-K by the caller.
             # `tools` maps the TOOL_SPECS names to callables that take **kwargs and return the dicts above.
             # `history` ends with the newest user turn.

      2) providers/heuristic.py — class HeuristicProvider (name = "heuristic"), no external calls.
         score_articles: lower-case the title. relevance 1.0 and category "company" if the cleaned company name
           (strip Inc/Corp/Corporation/Ltd/plc/Co/Holdings and punctuation; also try the first word if the name
           has 2+ words and the first word is 4+ letters) or the ticker (as a whole word, only when len>=3) is in
           the title; else 0.7/"industry" if a peer ticker (whole word) or the industry string is in the title;
           else 0.5/"macro" if any MACRO_TERMS hit; else 0.1 with category = move.routing.
         explain: relevant = [s for s in scored if s.relevance >= 0.5]. If not relevant and abs(ret_z) < 3:
           ExplanationResult(summary=f"{ticker} moved {ret:+.1%} on {date} (z={ret_z:+.1f}); no headline in the
           ±1 day window matched the company, its peers or macro terms.", primary_category="unexplained",
           confidence=0.2, cited_article_ids=(), unexplained=True). Otherwise primary_category = move.routing;
           summary is 2-3 templated sentences: direction and size; which component dominated with the three
           components in percentage points; "The day was inside an earnings window." when near_earnings;
           peer co-movement when peer_comove is not None; then "Related headlines: " + up to 3 titles with
           source. confidence = min(0.9, 0.3 + 0.15*min(len(relevant),3) + 0.2*(near_earnings) +
           0.1*(dominant share >= 0.6)) where dominant share = abs(dominant component)/sum of abs components
           (0 if all None). cited_article_ids = ids of up to 3 relevant articles.
         suggest_peers: return [].
         chat: rule-based single tool call. ticker = the `ticker` arg, else the first whole-word match of
           r"\b[A-Z]{2,5}\b" in the last user turn that is not in a stoplist {"I","A","THE","WHY","DID","WHAT",
           "HOW","IS","IT","ON","IN","OF","TO","AND","OR","FOR","USD","CEO","AI","US","ETF"}; if none, reply
           "Tell me a ticker, e.g. 'why did NVDA drop on 2025-08-28?'" with no tool calls. date = first
           r"\d{4}-\d{2}-\d{2}" match. If "news" or "headline" in the text -> search_news(ticker=..., limit=10);
           elif date -> get_move(ticker, date); else list_moves(ticker, direction=("down" if any of drop/fall/
           down/plunge/sank in text else "up" if any of jump/rise/up/rally/soar else None), limit=5).
           Wrap the call in try/except and put the error string in the reply if it fails. Render a plain-text
           reply: for get_move — the explanation summary (or "No explanation yet") plus up to 3 headlines; for
           list_moves — one line per move "YYYY-MM-DD  ret  z  routing  summary-or-blank"; for search_news — one
           line per article. Return ChatReply(reply, [ToolCallRecord(name, input, output)]).

      3) providers/__init__.py
         def get_provider(settings: Any | None = None) -> ModelProvider:
             lazily `from stock_moves.settings import get_settings` if settings is None; if
             settings.anthropic_api_key: try `from stock_moves.providers.anthropic import AnthropicProvider` and
             return AnthropicProvider(api_key=..., model=settings.anthropic_model); on ImportError fall through.
             Return HeuristicProvider(). Re-export the base names.

      4) tests/test_heuristic_provider.py — build MoveContext by hand (no DB): scoring cases above; explain
         unexplained case and a routed case citing <=3 ids; chat with fake tools (dicts of lambdas recording
         calls): "what happened to TEST on 2025-06-03" calls get_move once with ticker "TEST", date "2025-06-03";
         "any news on TEST" calls search_news; "why did TEST drop" calls list_moves with direction "down";
         a message with no ticker makes no tool call. Also test MoveContext.from_objects with SimpleNamespace.

      ACCEPTANCE: uv run pytest -q tests/test_heuristic_provider.py passes; ruff clean.

  - id: T3
    title: Move maths as pure DataFrame functions
    wave: 1
    depends_on: []
    critical_path: false
    estimate_min: 35
    owns:
      - src/stock_moves/moves.py
      - tests/synth.py
      - tests/test_moves.py
    prompt: |
      TASK T3 — DESIGN §1 as pure functions over pandas DataFrames. No I/O, no imports from other stock_moves
      modules. Every function takes/returns frames indexed by a tz-naive DatetimeIndex named "date", sorted
      ascending, with lower-case columns open, high, low, close, volume.

      OWNS: src/stock_moves/moves.py, tests/synth.py, tests/test_moves.py.

      src/stock_moves/moves.py:
        def compute_returns(df: pd.DataFrame) -> pd.DataFrame
            # returns a copy with ret = close.pct_change(), gap_ret = open/close.shift(1) - 1,
            # intraday_ret = close/open - 1
        def rolling_z(series: pd.Series, window: int = 20) -> pd.Series
            # series / series.shift(1).rolling(window, min_periods=window).std(); today excluded from the std
        def volume_z(volume: pd.Series, window: int = 20) -> pd.Series
            # volume / volume.shift(1).rolling(window, min_periods=window).mean()
        def decompose(ret: pd.Series, ret_mkt: pd.Series, ret_sec: pd.Series | None, window: int = 60) -> pd.DataFrame
            # For each day t, OLS with intercept of ret on [ret_mkt, ret_sec] over the `window` days ending at
            # t-1 (exclusive of t), numpy.linalg.lstsq on the aligned, NaN-dropped window; require at least
            # `window` rows else NaN. Columns: beta_mkt, beta_sec, alpha, mkt_component = beta_mkt*ret_mkt[t],
            # sector_component = beta_sec*ret_sec[t], idio_component = ret[t] - mkt - sector.
            # If ret_sec is None: beta_sec = 0.0, sector_component = 0.0 (still regress on mkt only).
            # Vectorise or loop; 300 rows must run well under a second.
        def route(mkt_component: float, sector_component: float, idio_component: float) -> str
            # scalar; largest absolute value wins: "macro" (mkt), "industry" (sector), "company" (idio);
            # any NaN/None -> "company"; exact ties -> "company".
        def regime(close: pd.Series, fast: int = 50, slow: int = 200) -> pd.Series
            # "bull" if SMA(fast) >= SMA(slow) else "bear"; None where SMA(slow) is NaN (use min_periods=slow).
            # If the series is shorter than `slow`, fall back to min_periods=max(fast, len//2) so a 1y history
            # still gets a label after the first ~125 rows; document this in the docstring.
        def near_earnings(index: pd.DatetimeIndex, earnings_dates: Iterable[date | datetime], tolerance: int = 1) -> pd.Series
            # bool per index position: True if a trading day within `tolerance` positions in the index (not
            # calendar days) has a date equal to an earnings date. Earnings dates that are not trading days map
            # to the next trading day at or after them. Future dates beyond the index are ignored.
        def peer_comove(peer_returns: pd.DataFrame, dates: pd.DatetimeIndex) -> pd.Series
            # peer_returns: one column per peer of daily ret; mean across peers per date (skipna); NaN if empty.
        def build_features(stock: pd.DataFrame, spy: pd.DataFrame, etf: pd.DataFrame | None,
                           earnings_dates: Iterable[date] = (), z_window: int = 20, ols_window: int = 60) -> pd.DataFrame
            # Inner-join on index with spy (and etf if given). Output has the OHLCV columns plus exactly:
            # ret, gap_ret, intraday_ret, ret_z, vol_z, mkt_component, sector_component, idio_component,
            # routing, regime_mkt, regime_sector, near_earnings. regime_sector None if etf is None.
            # routing applied row-wise via route(); rows where ret is NaN keep routing None.
        def detect_moves(features: pd.DataFrame, z_threshold: float = 2.0, pct_threshold: float = 0.02) -> pd.DataFrame
            # rows where abs(ret_z) >= z_threshold OR abs(ret) >= pct_threshold (NaN ret_z counts as not
            # passing the z test but abs(ret) can still pass); adds direction = "up"/"down"; sorted by
            # abs(ret_z) desc (NaN last).

      tests/synth.py (plain module, importable from tests because tests/conftest.py puts tests/ on sys.path):
        def synthetic_ohlcv(n_days: int = 320, seed: int = 0, daily_vol: float = 0.01, drift: float = 0.0003,
                            shocks: dict[int, float] | None = None, start: str = "2025-01-02") -> pd.DataFrame
            # business-day index named "date", geometric random walk close, open = prev close*(1+small noise),
            # high/low bracket open/close, volume lognormal around 1e6; shocks {position: return} injected
            # into that day's close-to-close return. Deterministic for a seed.
        def synthetic_market(n_days: int, seed: int, correlate_with: pd.Series | None = None, beta: float = 0.8) -> pd.DataFrame
            # optional helper: a frame whose returns are beta*given returns + noise (so OLS has signal).

      tests/test_moves.py: stock = synthetic_ohlcv(shocks={250: -0.08}); spy, etf from synthetic helpers.
        - build_features has every column above, same length as the inner join, no exception.
        - detect_moves at defaults contains the shock date, direction "down"; with z_threshold=50 and
          pct_threshold=0.5 returns empty; with pct_threshold=0.0 returns every row with a non-NaN ret.
        - route(0.01, 0.02, 0.005) == "industry"; route(0.03, 0.0, 0.01) == "macro"; route(nan, 1, 1) == "company";
          route(0.01, 0.01, 0.01) == "company".
        - rolling_z: first `window` values NaN; a constant series after warm-up yields NaN/inf-free handling
          (std 0 -> NaN, not exception).
        - regime on a rising series is "bull" at the end, on a falling series "bear".
        - near_earnings with an earnings date equal to index[100] is True at positions 99, 100, 101 only.
        - decompose with etf None gives sector_component == 0.0 after warm-up; with a market built as
          beta 0.8 * stock noise the fitted beta_mkt is within 0.4 of the truth on the last row.

      ACCEPTANCE: uv run pytest -q tests/test_moves.py passes in under 5 s; ruff clean.

  - id: T4
    title: yfinance prices, sector ETF map, info and earnings dates
    wave: 1
    depends_on: []
    critical_path: false
    estimate_min: 25
    owns:
      - src/stock_moves/prices.py
      - tests/test_prices.py
    prompt: |
      TASK T4 — price and metadata fetch (DESIGN §1, §2 inputs). Facts verified on 2026-09-15 you can rely on:
      yfinance `Ticker(t).history(period="1y")` returns ~251 rows with a tz-aware DatetimeIndex and columns
      Open/High/Low/Close/Volume/Dividends/Stock Splits; `Ticker(t).info` has "shortName", "longName",
      "sector", "industry"; `Ticker(t).earnings_dates` is a DataFrame indexed by tz-aware datetime including
      future dates (it can be None or raise for some tickers).

      OWNS: src/stock_moves/prices.py, tests/test_prices.py. No imports from other stock_moves modules.

      src/stock_moves/prices.py:
        MARKET_ETF = "SPY"
        SECTOR_ETF: dict[str, str] = {"Technology": "XLK", "Financial Services": "XLF", "Energy": "XLE",
            "Healthcare": "XLV", "Consumer Cyclical": "XLY", "Consumer Defensive": "XLP", "Industrials": "XLI",
            "Basic Materials": "XLB", "Utilities": "XLU", "Real Estate": "XLRE", "Communication Services": "XLC"}
        class PriceFetchError(RuntimeError)
        @dataclass(frozen=True) class TickerInfo: ticker: str; name: str; sector: str | None;
            industry: str | None; sector_etf: str | None
        def sector_etf_for(sector: str | None) -> str | None
        def normalize_ohlcv(raw: pd.DataFrame) -> pd.DataFrame
            # pure: accept the yfinance history frame (or a MultiIndex-column download frame: take level 0);
            # keep Open/High/Low/Close/Volume -> lower-case; index -> tz-naive, normalized to midnight, named
            # "date", sorted, duplicates dropped (keep last); drop rows where close is NaN; volume as float.
        def fetch_ohlcv(ticker: str, period: str = "1y") -> pd.DataFrame
            # yf.Ticker(ticker).history(period=period, auto_adjust=False) -> normalize_ohlcv; raise
            # PriceFetchError(f"no price data for {ticker}") when empty.
        def fetch_info(ticker: str) -> TickerInfo
