  - id: T14
    title: Ticker routes — ingest, filtered read, single move with on-demand explanation; end-to-end API test
    wave: 4
    depends_on: [T10, T11, T12]
    critical_path: true
    estimate_min: 35
    owns:
      - src/stock_moves/api/tickers.py
      - tests/test_api.py
    prompt: |
      TASK T14 — DESIGN §5 lazy population and §6 ticker endpoints. Overwrite the stub
      src/stock_moves/api/tickers.py (keep the name `router`). Do not touch api/app.py.

      OWNS: src/stock_moves/api/tickers.py, tests/test_api.py.
      USES: stock_moves.ingest (ingest_ticker, enrich_move, needs_ingest); stock_moves.queries (everything);
      stock_moves.api.deps; stock_moves.api.schemas; stock_moves.settings.

      src/stock_moves/api/tickers.py — router = APIRouter(prefix="/tickers", tags=["tickers"]); tickers are
      upper-cased; 404 with {"detail": ...} when a ticker has no price data after ingest or a move date has
      no move; a prices.PriceFetchError during ingest -> 404 "unknown ticker or no price data".
        @router.post("/{ticker}/ingest", response_model=IngestResponse)
          query: period: str = settings default; top_n: int = default; z_threshold: float = default;
          pct_threshold: float = default; refresh: bool = True.   -> ingest_ticker(...) mapped to IngestResponse.
        @router.get("/{ticker}", response_model=TickerResponse)
          query: start: date|None; end: date|None; z_threshold: float = default; pct_threshold: float = default;
          direction: Literal["up","down"]|None; category: Literal["company","industry","macro","unexplained"]|None;
          min_relevance: float = 0.0; include_prices: bool = False; include_news: bool = True; limit: int = 50;
          refresh: bool = False; period: str = default; top_n: int = default.
          If needs_ingest(session, ticker) or refresh: ingest_ticker(session, ticker, period=period,
          top_n=top_n, z_threshold=z_threshold, pct_threshold=pct_threshold, refresh=refresh); ingested=True.
          Then moves = list_moves(session, ticker, MoveFilters(...)); for each move attach
          explanation_to_dict(get_explanation(...)) and, when include_news, articles_for_move(m.id,
          min_relevance) as article dicts (empty list otherwise); prices = list_prices(session, ticker, start,
          end) when include_prices else None; filters = the effective query params as a dict. Build the
          response from dicts (TickerResponse.model_validate).
        @router.get("/{ticker}/moves/{move_date}", response_model=MoveOut)
          path move_date: date; query min_relevance: float = 0.0; refresh: bool = False.
          If needs_ingest -> ingest with defaults. move = get_move(...) or 404. If it has no explanation or
          refresh: enrich_move(session, move, company, provider, get_news_source(settings.news_source, ...),
          refresh=refresh). Return move_to_dict(move, explanation, articles_for_move(...)).

      tests/test_api.py — the end-to-end check with zero network:
        fixture `client`: no_api_key fixture; configure_engine("sqlite://"); deps.reset_provider_cache();
        monkeypatch stock_moves.prices.fetch_ohlcv (synthetic_ohlcv per ticker, shock {250: -0.08} for
        "TEST", stable seeds), prices.fetch_info (TickerInfo TEST/Test Corp/Technology/Semiconductors/XLK),
        prices.fetch_earnings_dates ([]), prices.fetch_peer_returns (empty), and
        stock_moves.ingest.get_news_source -> a FakeNewsSource returning two items (one mentioning "Test
        Corp") and counting calls; TestClient(create_app()).
        Tests: (1) GET /tickers/TEST -> 200, ingested True, company.name "Test Corp", moves non-empty, the shock
        date is in moves with direction "down", explanation.primary_category == "company" and one cited id,
        articles non-empty on that move. (2) second GET -> ingested False and the news source call count did
        not change. (3) GET ?direction=up -> no "down" moves; ?z_threshold=100&pct_threshold=1 -> []; ?
        include_prices=true -> prices list length > 200 with the DESIGN columns; ?include_news=false ->
        articles == [] on every move; ?category=company -> every move's explanation category (or routing when
        unexplained) is company; ?limit=1 -> one move. (4) GET /tickers/TEST/moves/<shock date> -> 200 with
        explanation; GET for a date with no move -> 404. (5) POST /tickers/TEST/ingest?top_n=1 -> 200 with
        n_explanations >= 1 and n_prices > 200. (6) GET /tickers/NOPE where fetch_ohlcv raises
        PriceFetchError -> 404.

      ACCEPTANCE: uv run pytest -q tests/test_api.py passes in under 20 s; the full suite `uv run pytest -q`
      is green; ruff clean.

  - id: T15
    title: Integration run on real data, wiring fixes, README run instructions
    wave: 5
    depends_on: [T9, T13, T14]
    critical_path: true
    estimate_min: 30
    owns:
      - README.md
      - src/stock_moves/__init__.py
      - .gitignore
      - data/.gitkeep
      - "any file, for wiring fixes only (this task runs alone)"
    prompt: |
      TASK T15 — integration. You run alone; you may edit any file to fix wiring, but keep fixes minimal and
      report each one. Network is allowed here (and only here).

      OWNS: README.md, src/stock_moves/__init__.py, .gitignore, data/.gitkeep, plus wiring fixes anywhere.

      1. src/stock_moves/__init__.py: `def main() -> None` runs `uvicorn.run("stock_moves.api.app:app",
         host="127.0.0.1", port=8000, reload=False)` so `uv run stock-moves` starts the server (pyproject
         already maps the script). Add `data/*.db` to .gitignore and commit an empty data/.gitkeep.
      2. Full suite: `uv run ruff check . && uv run ruff format . && uv run pytest -q` must be green.
      3. Start the server (`uv run stock-moves` in the background) and run, in order, saving outputs:
           curl -s -X POST 'http://127.0.0.1:8000/tickers/AAPL/ingest?period=1y&top_n=5' | python -m json.tool
           curl -s 'http://127.0.0.1:8000/tickers/AAPL?direction=down&limit=5' | python -m json.tool | head -80
           curl -s 'http://127.0.0.1:8000/tickers/AAPL?z_threshold=2.5&include_news=false' | python -m json.tool | head -40
           curl -s 'http://127.0.0.1:8000/tickers/AAPL/moves/<a date from the first call>' | python -m json.tool
           curl -s -X POST http://127.0.0.1:8000/chat -H 'content-type: application/json' \
                -d '{"message":"why did AAPL drop the most this year?","ticker":"AAPL"}' | python -m json.tool
           curl -s http://127.0.0.1:8000/ | head -5
         Expected: ingest returns n_prices ~250, n_moves >= 1, n_explanations == min(5, n_moves); the GET
         returns moves with articles whose titles are real headlines dated within ±1 day of the move; the
         chat reply names dates. If ANTHROPIC_API_KEY is set in .env the provider field says "anthropic",
         otherwise "heuristic" — run at least the heuristic path; run the anthropic path too if a key exists.
         If Google News RSS returns nothing, retry with NEWS_SOURCE=gdelt and note the time it took.
      4. Fix what breaks (import cycles, wrong keyword names, NaN serialisation, tz issues in dates). Each fix:
         one sentence in the report saying file + what + why.
      5. README.md — replace the "Approach" placeholder and extend Setup/Run:
         - one-paragraph description (from DESIGN §0), zero keys required, optional ANTHROPIC_API_KEY and
           NEWS_SOURCE in .env (give a .env example);
         - `uv sync`, `uv run stock-moves`, open http://127.0.0.1:8000/ (chat) and /docs (Swagger);
         - the six curls above with a trimmed real response excerpt for the first two;
         - how thresholds work (ingest-time thresholds decide which days become moves; GET thresholds filter;
           re-ingest with lower thresholds to see more);
         - `uv run pytest -q` and what the tests cover (no network);
         - a "Design" line pointing at DESIGN.md, docs/architecture-v1.md, docs/architecture-v2.md;
         - a "Limitations" list copied from docs/architecture-v1.md's Known limitations.
      6. Stop the server. Report: files changed, the curl outputs (trimmed), timings for ingest with each
         news source you tried, and anything that is still wrong.

      ACCEPTANCE: the six curls return the shapes above against live data; full pytest green; README has run
      instructions a stranger can follow.

  - id: T16
