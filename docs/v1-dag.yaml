    wave: 6
    depends_on: [T15]
    critical_path: true
    estimate_min: 15
    owns:
      - docs/WRITEUP.md
    prompt: |
      TASK T16 — docs/WRITEUP.md, the short written part of the submission. Brief: the whole file under 120
      lines, plain English, no marketing. Base every claim on what was actually built and on T15's report
      (ask the coordinator for it if it is not in your context); do not describe features that did not land.

      OWNS: docs/WRITEUP.md.

      Structure: a two-sentence summary of the system, then one section per submission question, each 6-15
      lines, using the question's exact wording as the heading. The four questions are appended below under
      `--- QUESTIONS ---`. If that section is empty, use these four headings, which cover what such prompts
      ask, and flag at the top of the file that the headings are provisional:
        1. How does the system decide what a "major" move is, and why?  (DESIGN §1: z-score of returns over a
           trailing 20-day window, pct threshold kept as a parameter; both are query filters.)
        2. How does it explain a move, and how do you keep it honest?  (DESIGN §0/§4: decomposition routes the
           news query; grounded retrieval in a ±1 day window; structured output with citations, confidence
           and an explicit `unexplained`; attribution not causation.)
        3. What would you change with more time or in production?  (DESIGN §7 and docs/architecture-v2.md:
           paid full-text news, own classifier trained on move_articles labels, calibration against a labeled
           set, scheduled ingest, multi-day windows, deployment.)
        4. How did you use AI tools, and how did you verify the result?  (the DESIGN-first workflow, a task
           DAG run by parallel agents, tests with synthetic prices and no network, the live AAPL run in T15.)
      End with a "Known limitations" list of at most 8 bullets taken from docs/architecture-v1.md.

      --- QUESTIONS ---
      1. Briefly describe your process for completing the project from start to finish. Include details on
         assumptions made and key decisions taken / tradeoffs made for each step (if relevant).
      2. Are you happy with your solution? Why or why not?
      3. What would you do differently if you got to do this over again?
      4. Did you get stuck anywhere? How'd you get unstuck?
      (These four, verbatim from the assignment email, are the headings. Brief answers only: the email
      says the write-up should take about 10 minutes.)

      ACCEPTANCE: file exists, under 120 lines, every heading is a question, no claim contradicts README or
      the T15 report.
