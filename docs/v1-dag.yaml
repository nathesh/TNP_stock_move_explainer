  - id: T9
    title: AnthropicProvider (scoring, explanation, peers, chat tool loop)
    wave: 2
    depends_on: [T2]
    critical_path: false
    estimate_min: 30
    owns:
      - src/stock_moves/providers/anthropic.py
      - tests/test_anthropic_provider.py
    prompt: |
      TASK T9 — the keyed ModelProvider (DESIGN §4). Uses the official `anthropic` Python SDK (already
      installed). Verified API shapes as of 2026: model id "claude-opus-5" (use exactly this string, no date
      suffix); structured output is `client.messages.parse(model=..., max_tokens=..., messages=[...],
      output_format=PydanticModel)` and the result is `response.parsed_output`; a manual tool loop is
      `client.messages.create(model, max_tokens, system, tools, messages)` -> stop while
      `response.stop_reason != "tool_use"`, else append {"role":"assistant","content":response.content}, run
      each block with `.type == "tool_use"` (fields .id, .name, .input dict) and append one user message whose
      content is a list of {"type":"tool_result","tool_use_id":block.id,"content":json.dumps(result)} (use
      "is_error": True with the error text when a tool raises). Adaptive thinking is on by default for this
      model; do not pass a `thinking` parameter, do not use `tool_choice` other than the default, no
      assistant prefill. max_tokens 2048 for scoring/peers, 4096 for explanations and chat.

      OWNS: src/stock_moves/providers/anthropic.py, tests/test_anthropic_provider.py.
      USES: stock_moves.providers.base (all types, TOOL_SPECS, MACRO_TERMS), stock_moves.providers.heuristic
      (HeuristicProvider, as the fallback).

      class AnthropicProvider (name = "anthropic"):
        __init__(self, api_key: str, model: str = "claude-opus-5", client: Any | None = None)
            # client defaults to anthropic.Anthropic(api_key=api_key); tests inject a fake.
        score_articles: one parse() call. Pydantic models: class _Score(BaseModel): article_id: int;
            relevance: float; category: Literal["company","industry","macro"]; class _Scores(BaseModel):
            scores: list[_Score]. System prompt: you are scoring headlines for whether they explain a given
            stock move; relevance 1 = directly about this company on this day, 0 = unrelated; category is
            what the headline is about. User content: the MoveContext fields as a compact JSON block, then the
            articles as "id | date | source | title" lines. Return scores for the given ids only; missing ids
            get relevance 0.0/category routing. On any exception -> HeuristicProvider().score_articles(...).
        explain: one parse() call with class _Explanation(BaseModel): summary: str; primary_category:
            Literal["company","industry","macro","unexplained"]; confidence: float; cited_article_ids: list[int];
            unexplained: bool. System prompt (DESIGN §0): attribution, not causation; cite only the given
            article ids; say `unexplained` when the evidence is weak; 2-4 sentences; mention the
            decomposition, regime, earnings proximity and peer co-movement when informative. Fallback to
            heuristic on exception.
        suggest_peers: parse() with class _Peers(BaseModel): tickers: list[str]; ask for up to 6 US-listed
            public peers by ticker, no ETFs; upper-case, drop the ticker itself; [] on exception.
        chat: manual loop with tools=TOOL_SPECS, at most 6 iterations. system: "You explain stock moves using
            only the tools' results; cite dates; if the tools return nothing say so. Default ticker: {ticker}."
            Convert history ChatTurn -> messages. Execute tools from the `tools` mapping with **block.input
            (inject ticker=default when the tool input has no ticker and a default exists); record
            ToolCallRecord(name, input, output). Final reply = concatenated text blocks. On exception ->
            HeuristicProvider().chat(...).

