      search_news, save_chat_message, chat_history, move_to_dict, article_to_dict); stock_moves.providers.base
      (ChatTurn, ToolFn); stock_moves.api.deps (get_db, get_provider_dep); stock_moves.api.schemas
      (ChatRequest, ChatResponse, ToolCallOut).

