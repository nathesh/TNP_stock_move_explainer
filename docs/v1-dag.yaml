    depends_on: [T3, T4, T5, T6, T7, T8, T10]
    critical_path: true
    estimate_min: 35
    owns:
      - src/stock_moves/ingest.py
      - tests/test_ingest.py
    prompt: |
      TASK T12 — DESIGN §1-§5 wired together. Idempotent on (ticker, date). Explanations for the top-N moves by
      abs(ret_z) at ingest; any other move is enriched on demand by enrich_move (called by GET .../moves/{date}).

      OWNS: src/stock_moves/ingest.py, tests/test_ingest.py.
      USES: stock_moves.settings.get_settings; stock_moves.models; stock_moves.prices (call via the module:
      `prices.fetch_ohlcv`, `prices.fetch_earnings_dates`, `prices.fetch_peer_returns` — never bind them as
      default args, tests monkeypatch the module attributes); stock_moves.moves (build_features, detect_moves,
      peer_comove); stock_moves.ontology.get_or_build_company; stock_moves.news (get_news_source,
      queries_for_move, window_for, NewsItem); stock_moves.scoring (upsert_articles, score_and_link,
      linked_articles); stock_moves.explain.get_or_create_explanation; stock_moves.providers.get_provider.

      src/stock_moves/ingest.py:
        @dataclass class IngestResult: ticker: str; period: str; top_n: int; n_prices: int; n_moves: int;
            n_articles: int; n_explanations: int; provider: str; news_source: str
        def ingest_ticker(session: Session, ticker: str, *, period: str | None = None, top_n: int | None = None,
                          z_threshold: float | None = None, pct_threshold: float | None = None,
                          refresh: bool = False, provider: ModelProvider | None = None,
                          news_source: NewsSource | None = None) -> IngestResult
          Steps (None args fall back to get_settings() defaults; provider -> get_provider(); news_source ->
          get_news_source(settings.news_source, timeout_s=..., throttle_s=...)):
          1. company = get_or_build_company(session, ticker, provider, refresh=refresh)
          2. stock = prices.fetch_ohlcv(ticker, period); spy = prices.fetch_ohlcv("SPY", period);
             etf = prices.fetch_ohlcv(company.sector_etf, period) if company.sector_etf else None (a
             PriceFetchError on the ETF -> None, on the stock -> re-raise); earnings =
             prices.fetch_earnings_dates(ticker); peers_ret = prices.fetch_peer_returns(company.peers, period)
             if company.peers else empty.
          3. features = build_features(stock, spy, etf, earnings). Upsert Price rows keyed on (ticker, date):
             update all computed columns for existing rows, insert the rest; NaN -> None. One commit.
          4. detected = detect_moves(features, z_threshold, pct_threshold); pc = peer_comove(peers_ret,
             detected.index) if peers else all-None. Upsert Move rows on (ticker, date) with the columns from
             the features row + direction + peer_comove. Do not delete moves that no longer qualify.
          5. top = the N moves with largest abs(ret_z) among ALL stored moves for the ticker (re-query the
             table). For each: enrich_move(..., refresh=refresh).
          6. Return IngestResult with counts from the table (n_articles = distinct articles linked to this
             ticker's moves; n_explanations = explanation rows for this ticker's moves).
        def enrich_move(session: Session, move: Move, company: Company, provider: ModelProvider,
                        news_source: NewsSource, *, refresh: bool = False, news_limit: int | None = None,
                        top_k: int | None = None) -> Explanation
          # If the move already has an Explanation and not refresh -> return it. Else: if the move has no
          # linked articles or refresh: start, end = window_for(move.date); for (bucket, query) in
          # queries_for_move(move.routing, company.name, company.ticker, company.peers, company.industry):
          # items = news_source.search(query, start, end, limit=news_limit) each tagged with
          # dataclasses.replace(item, bucket=bucket); articles = upsert_articles(session, items);
          # score_and_link(session, move, company, articles, provider). Then
          # get_or_create_explanation(session, move, company, provider, top_k=top_k, refresh=refresh).
          # A news_source exception is caught and logged; the move is still explained (likely `unexplained`).
        def needs_ingest(session: Session, ticker: str) -> bool     # not has_prices(session, ticker)

      tests/test_ingest.py (no network): monkeypatch stock_moves.prices.fetch_ohlcv with a function returning
      synthetic_ohlcv(seed=hash(ticker) % 1000, shocks={250: -0.08} if ticker == "TEST" else None) (import
      `from synth import synthetic_ohlcv`), prices.fetch_info -> TickerInfo("TEST","Test Corp","Technology",
      "Semiconductors","XLK"), prices.fetch_earnings_dates -> [], prices.fetch_peer_returns -> empty frame;
      a FakeNewsSource whose search records queries and returns two NewsItems (one title containing "Test
      Corp"); HeuristicProvider. ingest_ticker(session, "TEST", period="1y", top_n=3): n_prices == number of
      joined rows, n_moves >= 1, the shock date is a Move, exactly min(3, n_moves) explanations exist, the
      shock move's explanation cites the "Test Corp" article, FakeNewsSource saw a query starting with
      '"Test" stock'. Run ingest_ticker again with the same args: row counts identical, no new articles, the
      news source was not called again. enrich_move on a move outside the top-N creates its explanation.
      ingest with refresh=True calls the news source again and keeps one explanation per move.

      ACCEPTANCE: uv run pytest -q tests/test_ingest.py passes in under 10 s; ruff clean.

