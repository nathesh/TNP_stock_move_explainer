            # industry: '("<clean name>" OR <peer1> OR <peer2>... OR "<industry>") stock'  (skip missing parts)
            # macro:    '(' + ' OR '.join(f'"{t}"' for t in MACRO_QUERY_TERMS) + ') stock market'
            # anything else -> ValueError
        def queries_for_move(routing: str, company_name: str, ticker: str, peers: Sequence[str] = (),
                             industry: str | None = None) -> list[tuple[str, str]]
            # [(bucket, query)]: always the company query first; plus the industry or macro query when routing
            # is "industry" or "macro". This is "one query per move per routing bucket" with a company baseline.
        def get_news_source(name: str = "google_rss", *, timeout_s: float = 20.0, throttle_s: float = 5.0) -> NewsSource
            # "google_rss" -> GoogleNewsRSS(timeout_s); "gdelt" -> GDELTSource(timeout_s, throttle_s); else ValueError

      news/google_rss.py — class GoogleNewsRSS (name = "google_rss"):
        __init__(self, timeout_s: float = 20.0, client: httpx.Client | None = None)
        URL: https://news.google.com/rss/search?q=<urlencoded>&hl=en-US&gl=US&ceid=US:en where the query is
        f"{query} after:{start:%Y-%m-%d} before:{end + 1 day:%Y-%m-%d}" (Google's before: is exclusive).
        Send a desktop User-Agent header. Parse with xml.etree.ElementTree: for each channel/item read title,
        link, pubDate (email.utils.parsedate_to_datetime -> tz-aware UTC), and the <source> element's text as
        the outlet name. If the title ends with " - <source>" strip that suffix. Dedupe on link, keep order,
        cut to `limit`. Any httpx error, non-200, or parse error -> return [] (log a warning). language=None.
        def parse_rss(xml_text: str, bucket: str = "") -> list[NewsItem]   # pure, module-level
